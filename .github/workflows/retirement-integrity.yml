name: Repository retirement integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  retirement-integrity:
    name: Repository retirement integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Verify relocation and retired sync bridge
        run: node --test tests/repository-retirement.test.mjs
      - name: Verify patch formatting
        run: git diff --check HEAD^ HEAD
